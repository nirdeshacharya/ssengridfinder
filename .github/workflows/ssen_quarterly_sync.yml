name: SSEN Quarterly Data Sync & Deploy

on:
  # Runs at 04:00 UTC on the 1st day of every 3rd month (Quarterly: Jan, Apr, Jul, Oct)
  schedule:
    - cron: '0 4 1 */3 *'
  # Allows manual one-click trigger from the GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check SSEN Open Data Portal for Updates
        run: |
          python pipeline/fetch_ssen_live_updates.py

      - name: Process SSEN Datasets & Recalculate Ratings
        run: |
          python pipeline/build_site_finder_data.py

      - name: Rebuild Standalone Web Application
        run: |
          python pipeline/build_comprehensive_v2_portal.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html site_finder_bundle_2026.json data/
          if git diff --staged --quiet; then
            echo "No changes in SSEN data. Everything is up to date."
          else
            git commit -m "Automated SSEN Quarterly Data Refresh [skip ci]"
            git push
            echo "Pushed updated SSEN data to repository."
          fi
